services:
  postgres:
    image: postgres:16-alpine
    container_name: secureagentrag-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: sar_user
      POSTGRES_PASSWORD: sar_password
      POSTGRES_DB: secureagentrag
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sar_user -d secureagentrag"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: secureagentrag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    container_name: secureagentrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: secureagentrag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Pull required models before app starts
  ollama-pull:
    image: ollama/ollama:latest
    container_name: secureagentrag-ollama-pull
    entrypoint: >
      sh -c "
        echo 'Waiting for Ollama to be ready...' &&
        sleep 5 &&
        curl -sf http://ollama:11434/api/tags >/dev/null || (echo 'Ollama not ready, retrying...' && sleep 5) &&
        echo 'Pulling qwen3:8b...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"qwen3:8b\"}' &&
        echo 'Pulling bge-m3...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\":\"bge-m3\"}' &&
        echo 'Models pulled successfully.'
      "
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: secureagentrag-phoenix
    ports:
      - "6006:6006"
    volumes:
      - phoenix_data:/phoenix
    restart: unless-stopped
    environment:
      - PHOENIX_PORT=6006

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureagentrag-app
    ports:
      - "8501:8501"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SAR_PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  phoenix_data:
