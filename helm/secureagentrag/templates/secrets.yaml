{{- if or .Values.secrets.groq_api_key .Values.secrets.openai_api_key .Values.secrets.anthropic_api_key .Values.secrets.qdrant_api_key }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureagentrag.fullname" . }}-secrets
  labels:
    {{- include "secureagentrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.groq_api_key }}
  groq-api-key: {{ .Values.secrets.groq_api_key | quote }}
  {{- end }}
  {{- if .Values.secrets.openai_api_key }}
  openai-api-key: {{ .Values.secrets.openai_api_key | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropic_api_key }}
  anthropic-api-key: {{ .Values.secrets.anthropic_api_key | quote }}
  {{- end }}
  {{- if .Values.secrets.qdrant_api_key }}
  qdrant-api-key: {{ .Values.secrets.qdrant_api_key | quote }}
  {{- end }}
{{- end }}
