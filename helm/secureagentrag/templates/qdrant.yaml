{{- if .Values.dependencies.qdrant.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "secureagentrag.fullname" . }}-qdrant
  labels:
    {{- include "secureagentrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  serviceName: {{ include "secureagentrag.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      {{- include "secureagentrag.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        {{- include "secureagentrag.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.dependencies.qdrant.image | quote }}
          ports:
            - containerPort: 6333
              name: http
            - containerPort: 6334
              name: grpc
          {{- if .Values.dependencies.qdrant.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          {{- end }}
  {{- if .Values.dependencies.qdrant.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.dependencies.qdrant.persistence.size | quote }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureagentrag.fullname" . }}-qdrant
  labels:
    {{- include "secureagentrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
spec:
  selector:
    {{- include "secureagentrag.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: qdrant
  ports:
    - port: 6333
      targetPort: 6333
      name: http
    - port: 6334
      targetPort: 6334
      name: grpc
{{- end }}
