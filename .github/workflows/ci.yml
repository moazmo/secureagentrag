name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (core + dev + api)
        # The `api` extra (FastAPI, uvicorn, python-jose, python-multipart)
        # is required so the BYOK + REST surface is actually exercised in CI
        # — the public demo runs on it, so its tests must gate the build
        # rather than silently skip via importorskip.
        run: uv sync --frozen --group dev --extra api

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Pytest (unit — no external services)
        env:
          SAR_DEBUG: "false"
        # Integration tests need a live Qdrant; they run in the `integration`
        # job below. Everything else must pass without external services.
        run: uv run pytest -q --maxfail=1 -m "not integration"

  integration:
    name: Integration (live Qdrant)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project (core + dev + api)
        run: uv sync --frozen --group dev --extra api

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:6333/readyz >/dev/null; then echo "qdrant ready"; exit 0; fi
            sleep 2
          done
          echo "qdrant did not become ready" >&2; exit 1

      - name: Pytest (integration only)
        env:
          SAR_DEBUG: "false"
          SAR_QDRANT_URL: "http://localhost:6333"
        # -m integration selects the marked tests; the RBAC test asserts the
        # vector-layer access-control invariant against a real Qdrant.
        run: uv run pytest -q -m integration
