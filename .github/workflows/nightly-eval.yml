name: Nightly Eval

# Runs the Ragas eval suite on a fixed golden set every night and posts the
# results to `evaluation/history.jsonl`. A regression of more than 5pp on
# either faithfulness or context_precision fails the job and opens an issue.
#
# This is *not* a PR gate — the build runs without Ollama/Qdrant available
# in CI. To enable as a PR gate, mock the LLM + retrieval layers with the
# canned golden answers and short-circuit Ragas to the math-only path.

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daily
  workflow_dispatch:

jobs:
  ragas-eval:
    name: Ragas regression check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository == 'moazmo/secureagentrag' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install project + eval extras
        run: uv sync --frozen --extra evaluation

      - name: Run Ragas on the golden set
        env:
          SAR_DEBUG: "false"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python -m evaluation.nightly

      - name: Append result to history
        run: |
          mkdir -p evaluation/results
          cat evaluation/results/latest.json >> evaluation/history.jsonl
          echo "" >> evaluation/history.jsonl

      - name: Commit history + open issue on regression
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const latest = JSON.parse(fs.readFileSync('evaluation/results/latest.json', 'utf8'));
            if (latest.regression_detected) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Eval regression: ${latest.regressed_metric} dropped`,
                body: `Faithfulness/context_precision regressed below baseline.\n\n` +
                      '```json\n' + JSON.stringify(latest, null, 2) + '\n```'
              });
              core.setFailed(`Regression detected: ${latest.regressed_metric}`);
            }

      - name: Push history update
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation/history.jsonl
          git diff --cached --quiet || (git commit -m "chore(eval): append nightly result" && git push)
